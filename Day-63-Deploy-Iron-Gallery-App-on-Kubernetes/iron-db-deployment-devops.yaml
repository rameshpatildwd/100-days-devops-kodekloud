apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-db-deployment-datacenter
  namespace: iron-namespace-datacenter
spec:
  replicas: 1
  selector:
    matchLabels:
      db: mariadb
  template:
    metadata:
      labels:
        db: mariadb
    spec:
      containers:
         - name: iron-db-container-datacenter
           image: kodekloud/irondb:2.0
           env:
              - name: MYSQL_DATABASE
                value: database_apache
              - name: MYSQL_ROOT_PASSWORD
                value: rootpassword
              - name: MYSQL_PASSWORD 
                value: userpassword
              - name: MYSQL_USER
                value: database_user
              
           volumeMounts:
              - name: db
                mountPath: /var/lib/mysql

      volumes:
        - name: db
          emptyDir: {}